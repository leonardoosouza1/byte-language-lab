<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc">
    <div id="display">0</div>
    <button data-d="7">7</button>
    <button data-d="8">8</button>
    <button data-d="9">9</button>
    <button data-d="4">4</button>
    <button data-d="5">5</button>
    <button data-d="6">6</button>
    <button data-d="1">1</button>
    <button data-d="2">2</button>
    <button data-d="3">3</button>
    <button data-d=" "> </button>
    <button data-d="0">0</button>
    <button data-op="+">+</button>
    <button data-op="-">-</button>
    <button data-op="*">*</button>
    <button data-op="/">/</button>
    <button id="eq">=</button>
  </div>
  <script src="calculator.js"></script>
</body>
</html>
