[package]
name = "byte-language-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Empirical lab for byte-as-language hypothesis: structured byte streams as the unit of intelligence, replacing tokens and floats with positional-coded discrete units."

[lib]
name = "blab"
path = "src/lib.rs"

[[bin]]
name = "exp01_format"
path = "bin/exp01_format.rs"

[[bin]]
name = "exp02_arithmetic"
path = "bin/exp02_arithmetic.rs"

[[bin]]
name = "exp03_learn"
path = "bin/exp03_learn.rs"

[[bin]]
name = "exp04_compose"
path = "bin/exp04_compose.rs"

[[bin]]
name = "exp05_fsm_unified"
path = "bin/exp05_fsm_unified.rs"

[[bin]]
name = "exp06_bpe_compare"
path = "bin/exp06_bpe_compare.rs"

[[bin]]
name = "exp07_neural"
path = "bin/exp07_neural.rs"

[[bin]]
name = "exp08_tropical"
path = "bin/exp08_tropical.rs"

[[bin]]
name = "exp09_hopfield"
path = "bin/exp09_hopfield.rs"

[[bin]]
name = "exp10_predictive"
path = "bin/exp10_predictive.rs"

[[bin]]
name = "exp11_stdp"
path = "bin/exp11_stdp.rs"

[[bin]]
name = "exp12_cellular"
path = "bin/exp12_cellular.rs"

[[bin]]
name = "exp13_compression"
path = "bin/exp13_compression.rs"

[[bin]]
name = "exp14_robustness"
path = "bin/exp14_robustness.rs"

[[bin]]
name = "run_all"
path = "bin/run_all.rs"

[dependencies]
# Mantém dependências mínimas — todo código é nosso, validável byte a byte.
# Apenas RNG (reprodutível, sem cripto).

[dev-dependencies]
# Property tests: validar invariantes em milhões de inputs gerados
# (sem dependência: implementamos com rand simples + loops)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[profile.test]
opt-level = 1  # tests rodam rápido sem compilar 2x
