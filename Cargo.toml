[dependencies]
# Mantém dependências mínimas — todo código é nosso, validável byte a byte.
# Apenas RNG (reprodutível, sem cripto).
#
# Exceção justificada: GPU runtime (wgpu) é acesso a hardware, não algoritmia.
# A lógica numérica continua nossa (WGSL shaders em src/gpu/shaders/), apenas
# delegamos device init/queue/dispatch ao wgpu. RDNA2 alvo: wave32, 40 CUs,
# 64KB LDS/CU. Sem wgpu seríamos forçados a Vulkan/HIP raw — fora de escopo.
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
serde_json = "1"
rayon = "1.10"
num_cpus = "1.16"

# Path-dep para HSA AQL backend. Optional: build sem ROCm continua funcionando
# (a feature gpu-aql não está em default).
hip-ffi = { path = "../llm-lab/hip-ffi", optional = true }

[features]
default = []
# HSA AQL backend (RDNA2/ROCm). Bypass wgpu/Vulkan, usa kernel HIP nativo
# dispatched via packets HSA. Requer ROCm 7.x instalado e kernel ABI v5.
# Ver docs/migration-hsa-aql.md.
gpu-aql = ["dep:hip-ffi"]

[dev-dependencies]
# Property tests: validar invariantes em milhões de inputs gerados
# (sem dependência: implementamos com rand simples + loops)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[profile.test]
opt-level = 1  # tests rodam rápido sem compilar 2x
